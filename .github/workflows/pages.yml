name: Deploy MadePick to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Smoke test app without Supabase credentials
        run: node tests/smoke.mjs
      - name: Prepare public site
        run: |
          mkdir -p site
          cp index.html styles.css config.js app.js robots.txt sitemap.xml site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
