tent:space-between;gap:15px;margin-bottom:23px}.sectionTitle h2{font-size:27px;letter-spacing:-.8px;margin:7px 0}.muted{color:#82889e}.ways{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.way{background:white;text-align:left;padding:26px 23px;border:1px solid #e7e9f2;border-radius:20px;transition:.15s;min-height:214px}.way:hover,.item:hover{transform:translateY(-3px);box-shadow:0 9px 25px #1f22400e}.way .emoji{font-size:31px}.way h3{font-size:23px;margin:18px 0 10px}.way p{color:#777e98;line-height:1.6;margin:0}.way span{color:#6a52e9;font-weight:800;display:block;margin-top:19px}.way:nth-child(1){background:#f3f0ff}.way:nth-child(2){background:#edfaf6}.way:nth-child(3){background:#fff5eb}.area{padding:40px 0}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 23px}.search,.filter,input,textarea,select{border:1px solid #e0e4ee;border-radius:12px;padding:13px 14px;background:white;color:#292e4b}.search{flex:1;min-width:200px}.filter{min-width:145px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.item{background:white;border:1px solid #e8eaf1;border-radius:19px;padding:22px;transition:.15s;min-width:0}.item h3{margin:10px 0;font-size:19px}.item p{color:#6d748c;line-height:1.65;margin:0 0 19px;word-break:break-word}.item .row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.tag{display:inline-block;border-radius:15px;background:#f0eeff;color:#6651d6;font-size:12px;padding:6px 10px;font-weight:800}.tiny{font-size:12px;color:#868da5}.vote{border:1px solid #dddafa;border-radius:10px;background:#f8f7ff;padding:9px 12px;color:#6046cc;font-weight:800}.vote.on{background:#6852ed;color:white}.artbox{height:120px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(135deg,#e0dbff,#fce7ef);font-size:46px;margin-bottom:17px}.empt{border:1px dashed #daddef;padding:38px;text-align:center;border-radius:16px;color:#777e95}.footer{margin-top:55px;border-top:1px solid #e7e9f1;padding:25px 0;color:#838ba3;font-size:13px}.dialog{border:1px solid #e3e5ee;box-shadow:0 28px 90px #10143438;border-radius:22px;padding:30px;width:min(520px,calc(100vw - 26px))}.dialog::backdrop{background:#13132b8a}.dialog h2{margin:0 0 10px}.form{display:grid;gap:13px}.form label{display:grid;gap:7px;font-size:14px;font-weight:750}.form textarea{min-height:108px;resize:vertical}.form input,.form textarea,.form select{width:100%}.x{float:right;background:none;border:0;font-size:25px;color:#9398ad}.notice{padding:12px 14px;background:#fff8de;border:1px solid #f1e6b8;color:#766329;border-radius:10px;font-size:13px;line-height:1.5;margin:18px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#24243f;color:white;border-radius:12px;padding:13px 18px;box-shadow:0 8px 28px #0003;z-index:20;display:none}.mobileNav{display:none}.smallBtn{border:0;background:none;font-size:14px;font-weight:800;color:#634add}.display-none{display:none!important}@media(max-width:760px){.topbar{height:60px}.head{gap:12px}.brand{font-size:23px}.nav{display:none}.controls{gap:10px}.head .primary{display:none}.hero{grid-template-columns:1fr;padding:45px 0 22px}.hero h1{letter-spacing:-1.3px}.hero .art{min-height:190px;padding:20px}.mini{padding:13px}.ways{grid-template-columns:1fr;gap:11px}.way{min-height:0;padding:20px}.way h3{margin:10px 0 5px}.way p{font-size:14px}.way span{margin-top:9px}.grid{grid-template-columns:1fr}.section{padding:20px 0}.area{padding:24px 0}.sectionTitle h2{font-size:24px}.mobileNav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #e6e8f1;padding:9px 5px env(safe-area-inset-bottom)}.mobileNav button{border:0;background:none;color:#797f96;font-size:12px;font-weight:800;padding:7px}.mobileNav button.active{color:#624bea}.footer{margin-bottom:70px}.hero .sub{font-size:15px}}

<script>
(function(){
'use strict';
var K='madepick-live-demo-v1';
var locale=localStorage.getItem('mp-lang')==='en'?'en':'ko',view='home',search='',category='all',sort='popular';
var sample={requests:[{id:'r1',title:'유튜브와 인스타 동시 업로드',en:'Post videos to YouTube and Instagram at once',description:'여러 플랫폼에 영상을 한 번에 업로드하고 싶어요.',descriptionEn:'Upload one video to multiple platforms in a single step.',category:'productivity',votes:128,author:'Jin',status:'open',makers:0},{id:'r2',title:'AI 여행 일정 자동 생성기',en:'AI trip planner',description:'일정과 예산을 입력하면 여행 경로를 추천하는 서비스.',descriptionEn:'Plan a trip from budget, dates and interests.',category:'ai',votes:96,author:'Mina',status:'building',makers:1},{id:'r3',title:'집중력을 높이는 타이머',en:'Focus timer with daily stats',description:'집중 시간을 기록하고 목표 달성을 보여주세요.',descriptionEn:'Track focus sessions and everyday progress.',category:'productivity',votes:76,author:'Sam',status:'open',makers:0}],products:[{id:'p1',title:'MoneyMap',en:'MoneyMap',description:'예산과 저축 목표를 한눈에 살펴보는 대시보드',descriptionEn:'A simple dashboard for budgets and savings goals.',category:'finance',votes:342,down:11,author:'MadePick Demo',url:'',icon:'📈'},{id:'p2',title:'PixelPlay',en:'PixelPlay',description:'브라우저에서 즐기는 가벼운 퍼즐 게임',descriptionEn:'A playful puzzle game in your browser.',category:'game',votes:281,down:7,author:'MadePick Demo',url:'',icon:'🎮'},{id:'p3',title:'NoteNest',en:'NoteNest',description:'생각을 빠르게 저장하고 정리하는 메모 도구',descriptionEn:'Keep notes and organize your thoughts.',category:'productivity',votes:159,down:4,author:'MadePick Demo',url:'',icon:'📝'}],votes:{},joins:[]};
var state;try{state=JSON.parse(localStorage.getItem(K))||sample;if(!Array.isArray(state.requests)||!Array.isArray(state.products))state=sample;}catch(e){state=sample}
state.votes=state.votes||{};state.joins=state.joins||[];
var dict={home:['홈','Home'],requests:['요청하기','Request'],build:['만들어주기','Build'],showcase:['전시하기','Showcase'],rankings:['랭킹','Rankings'],submitProduct:['내 작품 등록 +','Submit product +'],slogan:['필요한 건 요청하고,<br>만든 건 <em>보여주세요.</em>','Request it. Build it.<br><em>Show it to the world.</em>'],subtitle:['아이디어를 요청하고, 제작에 참여하고, 직접 만든 앱과 웹사이트를 세상에 소개하세요.','Request new tools, help bring ideas to life, and share your own creations.'],requestNow:['아이디어 요청하기','Post an idea'],explore:['작품 둘러보기','Explore products'],how:['MadePick에서 할 수 있는 3가지','Three ways to get started'],rDesc:['이런 서비스 있었으면 좋겠어요! 원하는 아이디어를 남겨보세요.','Wish something existed? Share your idea.'],bDesc:['사람들이 요청한 아이디어를 찾아서 직접 만들어 보세요.','Find ideas from the community and volunteer to build.'],sDesc:['이미 만든 웹사이트나 앱을 등록하고 사람들에게 알려보세요.','Show the tools and apps you already made.'],go:['시작하기 →','Get started →'],wanted:['사람들이 원하는 서비스','Ideas people want'],popular:['지금 주목받는 작품','Discover new products'],all:['전체 보기 →','See all →'],search:['검색어를 입력하세요','Search ideas or products'],allcat:['모든 카테고리','All categories'],popularSort:['인기순','Most popular'],newSort:['최신순','Newest'],need:['나도 필요해요','I need this'],join:['제작 참여하기','Join as maker'],joined:['참여했어요','Joined'],submitted:['등록됐어요!','Successfully added!'],notice:['현재는 체험용 버전입니다. 등록·투표 내용은 내 브라우저에만 저장되고 다른 이용자에게 공유되지 않습니다.','This is a demo. Submissions and votes are saved only in your browser, not shared with other visitors.'],noresults:['검색 결과가 없어요.','No matching results.'],demo:['예시 데이터 · 실제 서비스 아님','Sample content · Not live products'],addRequest:['새 아이디어 요청','Post a new request'],addProduct:['내 작품 전시','Show your creation'],name:['제목','Title'],description:['설명','Description'],category:['카테고리','Category'],author:['작성자 이름','Your name'],link:['웹사이트 주소 (https://)','Website URL (https://)'],save:['등록하기','Publish'],voteDown:['비추천','Downvote'],alltime:['누적 인기 랭킹','All-time rankings'],buildMessage:['요청한 아이디어 중 마음에 드는 것을 선택해 자유롭게 제작에 참여하세요. 제작 의무나 보수는 발생하지 않아요.','Pick an idea you like and volunteer to build it. Participation is optional and unpaid.']};
var cats={all:['전체','All'],ai:['AI','AI'],productivity:['생산성','Productivity'],finance:['금융','Finance'],game:['게임','Games'],education:['교육','Education'],other:['기타','Other']};
function t(k){return dict[k]?dict[k][locale==='ko'?0:1]:k}function c(k){return cats[k]?cats[k][locale==='ko'?0:1]:k}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function persist(){localStorage.setItem(K,JSON.stringify(state))}function toast(s){var e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(window._tid);window._tid=setTimeout(function(){e.style.display='none'},2500)}
function navigate(page){view=page;search='';category='all';render();window.scrollTo({top:0,behavior:'smooth'})}
window.go=navigate;window.switchLocale=function(){locale=locale==='ko'?'en':'ko';localStorage.setItem('mp-lang',locale);render()};
function opts(){return Object.keys(cats).filter(function(a){return a!=='all'}).map(function(x){return '<option value="'+x+'">'+c(x)+'</option>'}).join('')}
function getName(a){return locale==='en'&&a.en?a.en:a.title}function getDesc(a){return locale==='en'&&a.descriptionEn?a.descriptionEn:a.description}
function list(arr,kind){if(!arr.length)return '<div class="empt">'+t('noresults')+'</div>';return '<div class="grid">'+arr.map(function(a){var isRequest=kind==='request',vkey=(isRequest?'r':'p')+a.id,vote=state.votes[vkey]||0;return '<article class="item">'+(isRequest?'':'<div class="artbox">'+esc(a.icon||'🚀')+'</div>')+'<div class="row"><span class="tag">'+esc(c(a.category))+'</span><span class="tiny">'+esc(a.author)+'</span></div><h3>'+esc(getName(a))+'</h3><p>'+esc(getDesc(a))+'</p><div class="row"><div><button class="vote '+(vote===1?'on':'')+'" onclick="vote(\''+kind+'\',\''+a.id+'\',1)">↑ '+(a.votes+(vote===1?1:vote===-1?-1:0))+'</button> '+(!isRequest?'<button class="vote '+(vote===-1?'on':'')+'" onclick="vote(\''+kind+'\',\''+a.id+'\',-1)" title="'+t('voteDown')+'">↓ '+(a.down||0)+'</button>':'')+'</div>'+(isRequest?'<button class="smallBtn" onclick="join(\''+a.id+'\')">'+(state.joins.indexOf(a.id)>=0?t('joined'):t('join'))+' ('+(a.makers||0)+')</button>':a.url?'<a class="smallBtn" href="'+esc(a.url)+'" target="_blank" rel="noopener noreferrer">↗ '+(locale==='ko'?'방문하기':'Visit')+'</a>':'<span class="tiny">'+t('demo')+'</span>')+'</div></article>'}).join('')+'</div>'}
window.vote=function(kind,id,value){var key=(kind==='request'?'r':'p')+id;state.votes[key]=state.votes[key]===value?0:value;persist();render()};
window.join=function(id){var i=state.joins.indexOf(id);if(i>=0)state.joins.splice(i,1);else state.joins.push(id);persist();render();toast(t('joined'))};
function sorted(arr){return arr.filter(function(a){return (category==='all'||a.category===category)&&[a.title,a.en,a.description,a.descriptionEn,a.author].join(' ').toLowerCase().includes(search.toLowerCase())}).sort(function(a,b){return sort==='popular'?b.votes-a.votes:String(b.id).localeCompare(String(a.id))})}
function bar(){return '<div class="bar"><input class="search" id="query" placeholder="'+t('search')+'" value="'+esc(search)+'" oninput="applySearch(this.value)"><select class="filter" id="category" onchange="applyCategory(this.value)"><option value="all">'+t('allcat')+'</option>'+Object.keys(cats).filter(function(k){return k!=='all'}).map(function(k){return '<option value="'+k+'" '+(category===k?'selected':'')+'>'+c(k)+'</option>'}).join('')+'</select><select class="filter" onchange="applySort(this.value)"><option value="popular" '+(sort==='popular'?'selected':'')+'>'+t('popularSort')+'</option><option value="new" '+(sort==='new'?'selected':'')+'>'+t('newSort')+'</option></select></div>'}
window.applySearch=function(v){search=v;var el=document.getElementById('results');if(el)el.innerHTML=results()};
window.applyCategory=function(v){category=v;document.getElementById('results').innerHTML=results()};
window.applySort=function(v){sort=v;document.getElementById('results').innerHTML=results()};
function results(){return list(sorted(view==='showcase'?state.products:state.requests),view==='showcase'?'product':'request')}
function section(title,btn,handler,content){return '<section class="section"><div class="sectionTitle"><h2>'+title+'</h2><button class="smallBtn" onclick="'+handler+'">'+btn+'</button></div>'+content+'</section>'}
function home(){return '<div class="shell"><section class="hero"><div><div class="eyebrow">✦ MADE BY PEOPLE, PICKED BY YOU</div><h1>'+t('slogan')+'</h1><p class="sub">'+t('subtitle')+'</p><div class="heroactions"><button class="primary" onclick="openForm(\'request\')">✦ '+t('requestNow')+'</button><button class="secondary" onclick="go(\'showcase\')">'+t('explore')+' →</button></div></div><div class="art"><div class="mini"><small>💡 REQUEST</small><strong>'+ (locale==='ko'?'이런 서비스 필요해요!':'I wish this existed!')+'</strong><p class="muted">↑ 128 '+t('need')+'</p></div><div class="mini"><small>🚀 SHOWCASE</small><strong>'+ (locale==='ko'?'아이디어가 작품으로!':'An idea becomes a product!')+'</strong><p class="muted">✨ MadePick</p></div></div></section>'+section(t('how'),'','void(0)','<div class="ways">'+[['requests','💡',t('requests'),t('rDesc')],['build','🛠️',t('build'),t('bDesc')],['showcase','🚀',t('showcase'),t('sDesc')]].map(function(a){return '<button class="way" onclick="go(\''+a[0]+'\')"><div class="emoji">'+a[1]+'</div><h3>'+a[2]+'</h3><p>'+a[3]+'</p><span>'+t('go')+'</span></button>'}).join('')+'</div>')+section(t('wanted'),t('all'),"go('requests')",list(state.requests.slice().sort(function(a,b){return b.votes-a.votes}).slice(0,2),'request'))+section(t('popular'),t('all'),"go('showcase')",list(state.products.slice().sort(function(a,b){return b.votes-a.votes}).slice(0,2),'product'))+'</div>'}
function panel(){var isShow=view==='showcase';return '<div class="shell area"><div class="eyebrow">MADEPICK COMMUNITY</div><div class="sectionTitle"><div><h2>'+(view==='build'?t('build'):view==='rankings'?t('alltime'):t(view))+'</h2><p class="muted">'+(view==='build'?t('buildMessage'):view==='showcase'?t('sDesc'):t('rDesc'))+'</p></div><button class="primary" onclick="openForm(\''+(isShow?'product':'request')+'\')">+ '+(isShow?t('addProduct'):t('addRequest'))+'</button></div><div class="notice">'+t('notice')+'</div>'+bar()+'<div id="results">'+(view==='rankings'?list(state.products.slice().sort(function(a,b){return b.votes-a.votes}),'product')+ '<h2 style="margin-top:36px">'+t('wanted')+'</h2>'+list(state.requests.slice().sort(function(a,b){return b.votes-a.votes}),'request'):results())+'</div></div>'}
function render(){document.documentElement.lang=locale;document.title='MadePick — '+(locale==='ko'?'요청하고 · 만들어주고 · 전시하고':'Request · Build · Show');document.getElementById('localeBtn').innerText=(locale==='ko'?'EN':'KO')+' 🌐';document.getElementById('nav').innerHTML=['home','requests','build','showcase','rankings'].map(function(k){return '<button class="'+(view===k?'active':'')+'" onclick="go(\''+k+'\')">'+t(k)+'</button>'}).join('');document.getElementById('mobileNav').innerHTML=['home','requests','build','showcase'].map(function(k,i){return '<button class="'+(view===k?'active':'')+'" onclick="go(\''+k+'\')">'+['⌂ ','💡 ','🛠 ','🚀 '][i]+t(k)+'</button>'}).join('');document.querySelector('[data-t="submitProduct"]').innerText=t('submitProduct');document.getElementById('app').innerHTML=view==='home'?home():panel();document.getElementById('footerNote').innerText=' · '+t('notice')}
window.openForm=function(kind){var d=document.getElementById('editor');document.getElementById('formHeading').innerText=kind==='request'?t('addRequest'):t('addProduct');document.getElementById('formSub').innerText=kind==='request'?t('rDesc'):t('sDesc');var fields=[['title',t('name'),'text',true],['description',t('description'),'textarea',true],['author',t('author'),'text',true]];if(kind==='product')fields.push(['url',t('link'),'url',true]);var h=fields.map(function(f){return '<label>'+f[1]+(f[2]==='textarea'?'<textarea name="'+f[0]+'" maxlength="1000" required></textarea>':'<input name="'+f[0]+'" type="'+f[2]+'" maxlength="160" '+(f[3]?'required':'')+'>')+'</label>'}).join('');h+='<label>'+t('category')+'<select name="category">'+opts()+'</select></label><button class="primary" type="submit">'+t('save')+'</button>';var form=document.getElementById('editForm');form.innerHTML=h;form.onsubmit=function(e){e.preventDefault();var f=new FormData(form);var a={id:String(Date.now()),title:String(f.get('title')||'').trim(),description:String(f.get('description')||'').trim(),author:String(f.get('author')||'').trim(),category:String(f.get('category')||'other'),votes:0};if(!a.title||!a.description||!a.author)return;if(kind==='product'){var url=String(f.get('url')||'').trim();try{var parsed=new URL(url);if(parsed.protocol!=='https:')throw Error('https');a.url=parsed.href}catch(err){toast(locale==='ko'?'https://로 시작하는 주소를 입력하세요.':'Enter a valid https:// URL.');return}a.icon='🚀';a.down=0;state.products.unshift(a)}else{a.status='open';a.makers=0;state.requests.unshift(a)}persist();d.close();navigate(kind==='product'?'showcase':'requests');toast(t('submitted'))};d.showModal()};
window.closeForm=function(){document.getElementById('editor').close()};
render();
})();
</script>
</body>
</html>
